name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify installed wheel and process restart
        shell: pwsh
        run: |
          $builtWheel = Get-ChildItem -LiteralPath dist -Filter 'qingshot-*.whl' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          python -m pip install --no-deps --target test-artifacts/ci-wheel $builtWheel.FullName
          python tools/verify_installed.py --package-dir test-artifacts/ci-wheel --data-dir test-artifacts/ci-wheel-data
